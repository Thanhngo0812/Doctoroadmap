[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doc2roadmap"
version = "0.1.0"
description = "Deterministic document parsing and structural chunking"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "docling==2.114.0",
  "pydantic-settings>=2.14,<3",
  "sentencepiece==0.2.1",
  "networkx==3.6.1",
  "leidenalg==0.12.0",
  "openpyxl==3.1.5",
  "google-auth[requests]==2.58.1",
  "pypdfium2==5.12.1",
  "numpy==2.5.2",
  "lightgbm==4.7.0",
  "scikit-learn==1.9.1",
  "joblib==1.6.0",
  "underthesea==9.5.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "httpx==0.28.1"]
web = [
  "fastapi==0.146.0",
  "uvicorn==0.54.0",
  "SQLAlchemy==2.1.5",
  "psycopg[binary]==3.3.6",
  "alembic==1.20.0",
  "argon2-cffi==25.1.0",
  "cloudinary==1.46.3",
  "python-multipart==0.0.32",
]

[project.scripts]
doc2roadmap = "doc2roadmap.presentation.cli.main:main"
web = "wayfinder.cli:main"

[tool.hatch.build]
dev-mode-dirs = ["src", "src/web/backend"]

[tool.hatch.build.targets.wheel]
packages = ["src/doc2roadmap", "src/web/backend/wayfinder"]
sources = { "src/doc2roadmap" = "doc2roadmap", "src/web/backend/wayfinder" = "wayfinder" }

[tool.hatch.build.targets.wheel.force-include]
"vendor/a1-nhe" = "doc2roadmap/infrastructure/parsing/nhe_models"
"vendor/a8-pass-phu-ml" = "doc2roadmap/infrastructure/secondary_models"

[tool.pytest.ini_options]
addopts = "-q -ra"
testpaths = ["tests", "src/web/backend/tests"]
markers = [
  "integration: exercises Docling on real document files",
  "postgres: requires the isolated PostgreSQL db-test service",
  "cloudinary: requires an explicitly configured Cloudinary account",
]
