name: wayfinder

services:
  db:
    image: postgres:16.15
    environment:
      POSTGRES_USER: wayfinder
      POSTGRES_DB: wayfinder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in src/web/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wayfinder -d wayfinder"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  db-test:
    image: postgres:16.15
    environment:
      POSTGRES_USER: wayfinder
      POSTGRES_DB: wayfinder_test
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:?Set POSTGRES_TEST_PASSWORD in src/web/.env}
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wayfinder -d wayfinder_test"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
