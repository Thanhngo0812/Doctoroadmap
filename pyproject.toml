[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doc2roadmap"
version = "0.1.0"
description = "Deterministic document parsing and structural chunking"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "docling==2.114.0",
  "pydantic-settings>=2.14,<3",
  "sentencepiece==0.2.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1"]

[project.scripts]
doc2roadmap = "doc2roadmap.presentation.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/doc2roadmap"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["integration: exercises Docling on real document files"]
